# TYS backend + PostgreSQL (+ isteğe bağlı frontend)
# Değerler aynı klasördeki .env dosyasından okunur (şablon: .env.example). Sırlar bu dosyaya yazılmaz.
# Zorunlu değişkenler (POSTGRES_PASSWORD, JWT_SECRET, APP_ENCRYPTION_KEY) eksikse compose hiç başlamaz.
# Varsayılan profil "prod": SMS bilgileri ve canlı adresler eksikse uygulama bilerek açılmaz.
# Yerel deneme için .env içinde SPRING_PROFILES_ACTIVE=docker verilebilir.
# Frontend de çalıştırılacaksa: docker compose --profile fullstack up -d (tys-fe deposu ../tys-fe altında olmalı)

services:

  tys:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimlanmali}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (en az 32 karakter) .env dosyasinda tanimlanmali}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY (32 bayt Base64) .env dosyasinda tanimlanmali}
      # Şema Flyway + uygulama tarafından yönetilir; mevcut veri silinmez.
      # create / create-drop / update KULLANMAYIN.
      JPA_DDL_AUTO: none
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      SMS_API_ID: ${SMS_API_ID:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-}
      TZ: Europe/Istanbul
    ports:
      - "8080:8080"
    networks:
      - tys_network

  postgres:
    # Testler ve yedekler PostgreSQL 16 ile yapıldı; 16 biçimindeki yedek 15'e geri yüklenemez.
    # Daha önce postgres:15 ile açılmış bir veri birimi varsa 16 o veriyi açamaz:
    # önce pg_dump ile yedek alın, birimi yeniden oluşturup pg_restore ile geri yükleyin.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimlanmali}
      TZ: Europe/Istanbul
    # Veritabanı yalnız sunucunun kendisinden erişilebilir; internete açılmaz
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tys_network

  tys-fe:
    profiles: ["fullstack"]
    build:
      context: ${TYS_FE_PATH:-../tys-fe}
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      API_ORIGIN: ${API_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    networks:
      - tys_network

volumes:
  postgres_data:

networks:
  tys_network:
    driver: bridge
