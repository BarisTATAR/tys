# TYS backend + PostgreSQL
# Değerler aynı klasördeki .env dosyasından okunur (şablon: .env.example). Sırlar bu dosyaya yazılmaz.
# Zorunlu değişkenler (POSTGRES_PASSWORD, JWT_SECRET) eksikse compose hiç başlamaz.
# Varsayılan profil "prod": SMS ve KBS bilgileri eksikse uygulama bilerek açılmaz.
# Yerel deneme için .env içinde SPRING_PROFILES_ACTIVE=docker verilebilir.

services:

  tys:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimlanmali}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (en az 32 karakter) .env dosyasinda tanimlanmali}
      # Şema: boş veritabanında uygulama kendisi kurar, mevcut veri silinmez.
      # create / create-drop KULLANMAYIN: uygulama her kapanışta tüm tabloları siler.
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-none}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      SMS_API_ID: ${SMS_API_ID:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-}
      KBS_TESIS_KODU: ${KBS_TESIS_KODU:-0}
      KBS_KULLANICI_TC: ${KBS_KULLANICI_TC:-0}
      KBS_SIFRE: ${KBS_SIFRE:-}
      TZ: Europe/Istanbul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Istanbul
    ports:
      - "8080:8080"
    networks:
      - tys_network

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimlanmali}
      TZ: Europe/Istanbul
    # Veritabanı yalnız sunucunun kendisinden erişilebilir; internete açılmaz
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tys_network

volumes:
  postgres_data:

networks:
  tys_network:
    driver: bridge
