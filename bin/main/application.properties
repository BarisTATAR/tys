spring.application.name=tys
# Yerel çalıştırma (Docker'da application-docker.properties veya env ile override edilir)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=123456
# schema.sql ile "tys" şeması oluşturulur (entity'ler schema = "tys" kullanıyor)
spring.sql.init.mode=always
# update: tabloları korur; create: her açılışta siler/yeniden oluşturur
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Tarihleri Europe/Istanbul olarak işle (UTC kaymasını önler)
spring.jackson.time-zone=Europe/Istanbul
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (Spring Security)
jwt.secret=${JWT_SECRET:tysJwtSecretKeyMin32KarakterOlmali123}
jwt.expiration-ms=1800000

# Misafir kurallar onay sayfası (SMS linki)
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}