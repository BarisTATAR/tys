/*
 * TYS backend derlemesi.
 * Spring Boot BOM (io.spring.dependency-management) yönettiği kütüphanelerin sürümleri burada yazılmaz.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

configurations {
    cxfCodegen
}

def cxfVersion = '4.1.9'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // KBS SOAP istemcisi
    implementation 'jakarta.xml.ws:jakarta.xml.ws-api'
    implementation 'jakarta.jws:jakarta.jws-api:3.0.0'
    implementation 'com.sun.xml.ws:jaxws-ri:4.0.5'
    implementation "org.apache.cxf:cxf-rt-frontend-jaxws:${cxfVersion}"
    implementation "org.apache.cxf:cxf-rt-transports-http:${cxfVersion}"
    implementation "org.apache.cxf:cxf-rt-transports-local:${cxfVersion}"
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
    implementation 'org.glassfish.jaxb:jaxb-runtime'

    // Word (kurallar) ve Excel (misafir içe aktarma)
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // Lombok önce çalışmalı; MapStruct'ın Lombok getter/setter'larını görmesi için bağlayıcı gerekir
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    cxfCodegen "org.apache.cxf:cxf-tools-wsdlto-core:${cxfVersion}"
    cxfCodegen "org.apache.cxf:cxf-tools-wsdlto-frontend-jaxws:${cxfVersion}"
    cxfCodegen "org.apache.cxf:cxf-tools-common:${cxfVersion}"
    cxfCodegen 'org.apache.cxf.xjc-utils:cxf-xjc-runtime:4.1.0'
    cxfCodegen "org.apache.cxf:cxf-tools-wsdlto-databinding-jaxb:${cxfVersion}"
}

// KBS WSDL ve şemaları repoda tutulur (src/main/resources/wsdl): derleme dış servise bağlı değildir.
// Çalışma zamanında WSDL classpath'ten okunur; servis adresi WSDL içindeki soap:address'tir.
// Jandarma WSDL'i güncellerse dosyalar yeniden indirilip schemaLocation'lar yerel adlara çevrilmelidir.
def wsdlFile = 'src/main/resources/wsdl/SrvShsYtkTml.wsdl'
def outputDir = "build/generated-sources/wsdl2java"
def packageName = 'com.tys.client'

tasks.register('wsdl2java', JavaExec) {
    group = 'wsdl'
    description = 'Generates Java code from the vendored KBS WSDL via Apache CXF'
    inputs.dir('src/main/resources/wsdl')
    outputs.dir(outputDir)

    mainClass.set('org.apache.cxf.tools.wsdlto.WSDLToJava')
    classpath = configurations.cxfCodegen
    jvmArgs = ["-Dfile.encoding=UTF-8"]
    args = [
            "-d", outputDir,
            "-p", packageName,
            "-wsdlLocation", "classpath:wsdl/SrvShsYtkTml.wsdl",
            "-xjc-npa", // avoid generated @XmlAccessorType(NONE)
            wsdlFile
    ]
}

sourceSets.main.java.srcDir outputDir
compileJava.dependsOn 'wsdl2java'

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'tys'
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}

// Duplicate JAR dosyaları için strateji belirle
tasks.named('bootJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Yerel sırlar (application-local.properties) hiçbir dağıtım paketine girmez; yalnız bootRun/IDE okur
    exclude '**/application-local.properties'
}

tasks.named('jar') {
    exclude '**/application-local.properties'
}
