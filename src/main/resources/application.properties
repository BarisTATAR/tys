spring.application.name=tys
# Sırlar ortam değişkeninden veya git'e girmeyen application-local.properties dosyasından gelir.
spring.config.import=optional:classpath:application-local.properties
# Yerel çalıştırma (Docker'da application-docker.properties veya env ile override edilir)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${local.datasource.password:}}
# schema.sql ile "tys" şeması oluşturulur (entity'ler schema = "tys" kullanıyor)
spring.sql.init.mode=always
# none: mevcut veritabanı doğrulanır, boş veritabanında tablolar SchemaBootstrap ile kurulur.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.defer-datasource-initialization=true
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
# SameSite=None yalnız HTTPS için. Farklı kök alan adı kullanılacaksa APP_COOKIE_SAME_SITE=None verin.
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.cookie.secure=${APP_COOKIE_SECURE:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Tarihleri Europe/Istanbul olarak işle (UTC kaymasını önler)
spring.jackson.time-zone=Europe/Istanbul
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (Spring Security). JWT_SECRET en az 32 karakter olmalıdır.
jwt.secret=${JWT_SECRET:${local.jwt.secret:}}
jwt.expiration-ms=1800000

# SMS ve KBS. Değerler repoda tutulmaz.
sms.api-url=${SMS_API_URL:https://api.vatansms.net/api/v1/1toN}
sms.api-id=${SMS_API_ID:${local.sms.api-id:}}
sms.api-key=${SMS_API_KEY:${local.sms.api-key:}}
sms.sender=${SMS_SENDER:${local.sms.sender:}}
kbs.tesis-kodu=${KBS_TESIS_KODU:${local.kbs.tesis-kodu:0}}
kbs.kullanici-tc=${KBS_KULLANICI_TC:${local.kbs.kullanici-tc:0}}
kbs.sifre=${KBS_SIFRE:${local.kbs.sifre:}}

# Misafir kurallar onay sayfası (SMS linki)
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}