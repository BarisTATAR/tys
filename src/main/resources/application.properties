spring.application.name=tys
# Sırlar ortam değişkeninden veya git'e girmeyen application-local.properties dosyasından gelir.
spring.config.import=optional:classpath:application-local.properties
# Yerel çalıştırma (Docker'da application-docker.properties veya env ile override edilir)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${local.datasource.password:}}

# Şema yönetimi:
#  - Flyway (db/migration) mevcut veritabanlarını sürümler arasında dönüştürür (baseline: eski Hibernate şeması = 1).
#  - Boş veritabanında tablolar SchemaBootstrap ile entity'lerden kurulur; dolu veritabanı açılışta doğrulanır.
#  - Hibernate ddl-auto kapalı: create / create-drop / update kullanmayın.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.flyway.enabled=true
spring.flyway.schemas=tys
spring.flyway.default-schema=tys
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Hibernate ile kurulmus eski sema
spring.flyway.locations=classpath:db/migration

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
# SameSite=None yalnız HTTPS için. Farklı kök alan adı kullanılacaksa APP_COOKIE_SAME_SITE=None verin.
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.cookie.secure=${APP_COOKIE_SECURE:}
# Ters vekil (nginx vb.) arkasında istemci IP'si ve https bilgisi yalnız güvenilen (iç ağ) vekillerden alınır.
server.forward-headers-strategy=native
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Tarihleri Europe/Istanbul olarak işle (UTC kaymasını önler). JVM saat dilimi TysApplication'da sabitlenir.
spring.jackson.time-zone=Europe/Istanbul
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (Spring Security). JWT_SECRET en az 32 karakter olmalıdır.
jwt.secret=${JWT_SECRET:${local.jwt.secret:}}
jwt.expiration-ms=1800000

# Geri çözülebilir sırlar (işletme KBS şifreleri) için AES-256 anahtarı: 32 bayt, Base64. Canlıda zorunlu.
app.encryption-key=${APP_ENCRYPTION_KEY:${local.encryption-key:}}

# Giriş denemesi sınırları (kullanıcı+IP, IP ve kullanıcı bazında; süre dakika)
app.security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
app.security.login.user-ip-max-failures=${LOGIN_USER_IP_MAX_FAILURES:5}
app.security.login.ip-max-failures=${LOGIN_IP_MAX_FAILURES:20}
app.security.login.user-max-failures=${LOGIN_USER_MAX_FAILURES:50}

# İlk yönetici (yalnız hiç yönetici yokken kullanılır; parola politikası uygulanır)
app.bootstrap.admin-username=${ADMIN_USERNAME:}
app.bootstrap.admin-password=${ADMIN_INITIAL_PASSWORD:}

# SMS. Değerler repoda tutulmaz. KBS bilgileri işletme başına yönetici panelinden girilir (şifreli saklanır).
sms.api-url=${SMS_API_URL:https://api.vatansms.net/api/v1/1toN}
sms.api-id=${SMS_API_ID:${local.sms.api-id:}}
sms.api-key=${SMS_API_KEY:${local.sms.api-key:}}
sms.sender=${SMS_SENDER:${local.sms.sender:}}

# Misafir kurallar onay sayfası (SMS linki) ve linkin geçerlilik süresi (gün)
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.rules-link.ttl-days=${RULES_LINK_TTL_DAYS:7}
