# Docker Compose ile çalışırken kullanılır (SPRING_PROFILES_ACTIVE=docker)
# Veritabanı: postgres servisi (container adı)
spring.datasource.url=jdbc:postgresql://postgres:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
# schema.sql ile "tys" şeması oluşturulur
spring.sql.init.mode=always
# Tabloları koru, sadece gerekirse güncelle
spring.jpa.hibernate.ddl-auto=update
