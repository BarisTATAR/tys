# Docker Compose ile yerel deneme (SPRING_PROFILES_ACTIVE=docker). Canlı için "prod" profilini kullanın.
# Veritabanı bağlantısı ve sırlar docker-compose.yaml / .env üzerinden ortam değişkeni olarak gelir.
spring.datasource.url=jdbc:postgresql://postgres:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Şema Flyway + SchemaBootstrap ile yönetilir; Hibernate tablo oluşturmaz/silmez.
spring.jpa.hibernate.ddl-auto=none
